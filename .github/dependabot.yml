# Dependency updates (md-files/11-testing-security-deployment.md, "Security review of this app":
# "Dependency audit clean; Dependabot or equivalent enabled"). Weekly, grouped so a week's minor
# and patch updates arrive as one pull request that CI checks as a whole. Security updates come as
# soon as GitHub knows of one (turn on "Dependabot security updates" in the repository's
# Settings > Code security as well).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
