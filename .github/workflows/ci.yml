# CI for every pull request and every push to main (docs/plan/01-foundation.md, prompt 01.2),
# adapted from ../hacker-simulation's workflow. Each check is its own job so a failure says which
# layer broke; "CI passed" at the end needs all of them, and is the one check to mark required in
# the branch protection rule for main (Settings > Branches), which is what blocks a merge on
# failure. No job needs a secret: nothing here calls a model, and the mentor (file 14) will be
# tested with the Anthropic SDK mocked. Deployment is Vercel's Git integration, not a job here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Lint, types, format, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Dependency audit (high and critical fail the build)
        run: pnpm audit --audit-level high

  unit:
    name: Unit tests (engine, terminal, settings, boundaries, components)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  content:
    name: Content validation (lessons, glossary, sandbox workstation, themes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:content
      # TODO(docs/plan/03-case-format-and-generator.md): every case YAML validates and is solvable.
      # - run: pnpm case:validate
      # The committed evidence JSON is what the generator builds from the case stories today, so a
      # story edit that nobody rebuilt fails here (docs/plan/03-case-format-and-generator.md).
      - run: pnpm evidence:check

  integration:
    name: Integration tests (route handlers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No integration tests exist yet: the mentor routes and their tests come with file 14
      # (docs/plan/14-mentor.md). TODO(docs/plan/14-mentor.md): drop --passWithNoTests then.
      - run: pnpm test:integration --passWithNoTests

  coverage:
    name: Coverage (src/sim and settings gated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            node -e "const t=require('./coverage/coverage-summary.json').total; for (const k of ['statements','branches','functions','lines']) console.log('- ' + k + ': ' + t[k].pct + '%')"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Build, bundle budget, secret scan, end-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Initial JS budget (fails on regression)
        run: pnpm bundle:check
      - name: No secrets or server-only code in the client bundle
        run: pnpm security:bundle
      - name: End-to-end tests, axe on every route and the security headers
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [static, unit, content, integration, coverage, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required check did not pass."
            exit 1
          fi
