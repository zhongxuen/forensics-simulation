# Records the Linux screenshot baselines for tests/e2e/visual.spec.ts (UIUX.md §2.9, O5). A
# baseline is a picture of one operating system's fonts, and CI runs on Linux, so until Linux
# pictures are committed the visual tests skip there. Run this by hand (Actions > Visual baselines
# > Run workflow) on the branch to record: it builds, records every picture, and uploads them as an
# artifact. Download it, look at each picture, and commit them into
# tests/e2e/visual.spec.ts-snapshots/. It never commits anything itself: a person reviews first.

name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  record:
    name: Record Linux screenshot baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Record the pictures
        run: pnpm test:e2e tests/e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          retention-days: 14
