# The sandbox (docs/plan/15-quality-and-launch.md, part B): evidence with no goals, at /sandbox.
#
# Not a case. There is no client, no letter, no objectives and no report, so it has a schema of its
# own (`SandboxSchema` in schema.ts), and the case catalog skips this file. Its story is played by
# the same generator as a case, into src/content/sandbox/evidence.json, and `pnpm evidence:check`
# holds the two together.
#
# The machines are Candlewright's own, from the training cupboard, so no client's evidence is used
# and no case is spoiled: a practice laptop, `train-lt-03`, and a practice copy of a small dispatch
# server, `train-srv-01`, both in the blue-team room (10.20.0.0/24). On the morning of Thursday 17
# September 2026 Kit ran a mixed drill against them from a practice machine on the Range
# (192.168.60.66), and Idris captured the laptop's memory and imaged its drive afterwards. A bit of
# everything, so every tool has something to find:
#
# - the drive: a draft deleted and left alone (recover), a handout deleted (recover or carve), a
#   statement partly written over (carve finds a start with no end), a file copied to a memory
#   stick, and a download;
# - memory: a .NET rota app with a runtime compiler's region, and a practice beacon named
#   `updater.exe` from the wrong folder, unlinked, with a whole program in memory, calling out once
#   a minute;
# - logs: refused sign-ins, a remote sign-in and a new account (security), process starts and
#   connections (sysmon-lite), requests to the server (web-access), the beacon and a blocked probe
#   (firewall), and name lookups (dns). No story action writes the `vpn` source yet, so it is not
#   handed over.
id: sandbox
title: The sandbox kit
banner: No goals here. Try any tool on anything.
summary: >-
  Candlewright's practice kit, from the training cupboard: a laptop's drive, its memory and five
  sets of logs from a morning when Kit ran a drill against it. Nothing is being asked, and nothing
  you do is kept after you leave.
seed: 20260917
tryThis:
  - { command: "cat handover.txt", why: "What arrived, and the fingerprint to check it against" }
  - {
      command: "acquire /dev/evidence/train-lt-03 --out images/train-lt-03.img",
      why: "Copy the drive before you touch it",
    }
  - { command: "lsfs images/train-lt-03.img -r -d", why: "Every deleted file on the copy" }
  - { command: "carve images/train-lt-03.img", why: "Files found in the space no file owns" }
  - { command: "mem psscan train-lt-03-mem", why: "Every process, the hidden one too" }
  - { command: "mem malfind train-lt-03-mem", why: "Memory that can be written and run" }
  - {
      command: "logq --id 4625 --count-by IpAddress",
      why: "Refused sign-ins, counted by where from",
    }
  - {
      command: "timeline --from 2026-09-17T08:55Z --to 2026-09-17T09:25Z",
      why: "The drill in one order",
    }

