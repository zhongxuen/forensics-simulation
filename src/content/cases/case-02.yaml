# case-02, "The deleted invoice" (docs/plan/11-case-2-the-deleted-invoice.md).
#
# The same Saturday as Case 1, from the bookkeeper's laptop. Invoices went missing, a customer has a
# price list they should not have, and the owner has already decided who did it. The case teaches
# MACB times, deleted against overwritten, recovery and carving, logon types and time zones, and it
# ends with the evidence clearing the person everyone suspected (docs/plan/99-reference.md, rule 4).
# Copy calls that person "the bookkeeper"; the account name `jory` is the only identifier, and it
# names a sign-in, not a person.
#
# Four places this file leaves the plan, each because of what a file system or the engine allows:
#
# - 11 §Story has the zip made at 19:41 and the invoices deleted at 19:42, with the zip partly
#   overwriting one of them. A file can only be written into clusters that are already free, so
#   here the price lists are read at 19:41 and the zip is written at 19:42:31, straight after the
#   deletions, into the clusters the long statement gave up. Every other time is the plan's.
# - The partial overwrite is `overwrite-clusters` with `keep: 1`: the statement's first cluster
#   survives (its header and the first runs), the rest belongs to the zip. `recover` refuses it,
#   and `carve` finds a PDF with a start and no end. `keep` was added to the action for this case.
# - The door log and the owner's message are `documents`: paperwork in the case folder, like the
#   letter, which no report answer can cite. The door log is not a log source (11 §Story).
# - The choice beat is the report's last question. The owner asks for a report that names the
#   bookkeeper, and the report is where the player answers. A pick that bends to the owner gets
#   Noor's explanation on the debrief (`feedback`), and Change your report offers the choice again.
#
# The time-zone twist: the owner's "around 20:40" and the door log's "18:31" are both British
# Summer Time, an hour ahead of UTC. Put beside the security log unconverted, the door log and the
# laptop's own sign-out look an hour apart, as if the bookkeeper stayed on after signing out, and
# the owner's time lands an hour after anything happened. Converted, the door log and the sign-out
# are the same minute, 17:31 UTC, more than two hours before the remote sign-in at 19:40 UTC.
id: case-02
version: 1
title: The deleted invoice
client:
  org: Quillfen Freight
  signedBy: Delia Quillfen, owner, Quillfen Freight, and Theo Ashgrove, team lead, Candlewright Security
  letter: |
    Three invoices have gone from the bookkeeper's laptop, and one of our customers, Brackensett
    Joinery, rang this morning quoting the rates we give our other customers. Those rates are in
    price lists on the same laptop.

    Please examine the bookkeeper's laptop, qf-lt-07, and the yard's logs, and tell us what
    happened to the invoices and the price lists. Gus Thimblegate took a fingerprint of the drive
    before it went into the bag. My message about Saturday, and the door log, are with it.

    You examined the yard office laptop last week, and it is not part of this. Nothing that
    belongs to a member of staff personally is to be looked at, and please do not contact
    Brackensett Joinery or look at their computers.
estimatedMinutes: 30
seed: 20260414
hook: Three invoices vanished and everyone suspects the bookkeeper. Follow the evidence, not the suspicion.
learningGoals:
  - The difference between a deleted file, which can come back, and an overwritten one, which can only be carved in part
  - How a sign-in record says which account signed in, from where, and in which way
  - Why a time means nothing until you know its zone, and how to put two clocks side by side
  - Why a report says what the evidence shows, whoever it points at
concepts:
  - foundations-what-forensics-is
  - foundations-chain-of-custody
  - foundations-hashing-for-evidence
briefing:
  scenario: >-
    The same weekend as the yard office laptop, a different machine. Three invoices have gone from
    the bookkeeper's laptop, a customer has a price list they should not have, and the door log
    shows the bookkeeper was the only one in on Saturday. The owner has already decided what
    happened. The laptop is on your desk in a sealed bag, with a letter, a message from the owner
    and a printout of the door log.
  role: >-
    You are on Candlewright Security's blue team, at the examining workstation ir-ws-01, signed in
    as examiner. The case folder is open in the terminal.
  authorization: >-
    Delia Quillfen, who owns Quillfen Freight, and Theo Ashgrove, Candlewright's team lead, both
    signed on 13 April 2026. The letter covers the bookkeeper's laptop, qf-lt-07, and the yard's
    security, process, firewall and name lookup logs. It does not cover the yard office laptop
    (examined last week), anything that belongs to a member of staff personally, or Brackensett
    Joinery and its computers.

