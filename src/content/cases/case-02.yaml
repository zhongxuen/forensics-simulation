    content: |
      From:    Delia Quillfen, owner, Quillfen Freight
      To:      Theo Ashgrove, Candlewright Security
      Sent:    Monday 13 April 2026, 08:52

      Theo,

      The invoices were deleted around 20:40 on Saturday. Our accounts program watches the
      invoices folder, and it sent me an email at 20:42 that night saying the folder had gone
      empty. I did not see it until this morning.

      The door log shows the bookkeeper was the only person in the yard on Saturday. I would
      like your report to confirm it was the bookkeeper, so that I can deal with it this week.

      Delia
