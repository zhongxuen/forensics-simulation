# The yard is shut at weekends, and the door log says who came in. Background activity keeps to
# weekdays, so the only weekend activity is the story's own.
noise: { profile: office-day, density: medium, weekends: false }

evidence:
  disks: [qf-lt-07]
  logs: [security, sysmon-lite, firewall, dns]
  memory: []
  # Both laptops showed British Summer Time. `--zone local` shows the security log and the drive
  # the way the laptops did; everything else prints in UTC.
  zones: { disk: Europe/London, security: Europe/London }

# The cold open: two lines, then the first objective (docs/plan/99-reference.md, "Cold opens").
beats:
  - on: start
    speaker: teammate-theo
    text: >-
      Theo Ashgrove, team lead. The owner wants a name, and I have told her what she gets instead:
      we examine the company's laptop and the company's logs, not a person, and the report says what
      they show, whoever it points at.
  - on: start
    speaker: teammate-idris
    text: >-
      Idris Fenwick, investigations. Three invoices gone from the bookkeeper's laptop, the same
      Saturday as the note on the office laptop. Copy the drive first, then let's see what it
      remembers.
  - on: { objective: copy-and-verify }
    speaker: mentor-noor
    text: >-
      Noor Halvorsen, your mentor. Same routine as last week, and it matters more this time: this
      report may be read by the person the owner suspects. Every sentence in it has to come out of
      a copy nobody can argue with.
  - on: { objective: recover-and-carve }
    speaker: teammate-kit
    text: >-
      Kit Nakashima-Reyes here, and that is the eeriest thing I have seen all week. Half a statement
      with no end, and a zip sitting where the rest of it used to be. Deleted means "can come back".
      Overwritten means "some of it, if you are lucky".
  - on: { objective: find-the-remote-logon }
    speaker: teammate-idris
    text: >-
      Look at the logon type before the name. Every sign-in this account made at its own keyboard
      is a 2. This one is a 10, from 10.60.0.21, and that address is the yard office laptop. The
      account was the bookkeeper's. The keyboard was not.
  - on: { objective: order-the-evening }
    speaker: mentor-noor
    text: >-
      Now hold the owner's message and the door log up against that. Both were written in British
      Summer Time, an hour ahead of UTC. Before you compare any two times, put them in the same
      zone, and say which one in the report.
  - on: complete
    speaker: teammate-theo
    text: >-
      The owner asked us to confirm a name. What we can confirm is that the bookkeeper went home at
      17:31 UTC, and that their account was used from the office laptop two hours later. That is a
      harder report to hand over, and it is the right one. Write it up.

objectives:
  - id: copy-and-verify
    description: Image the bookkeeper's laptop, and check your copy against the handover form.
    why: Everything in this report comes out of that copy, and the owner has already made up her mind. The copy has to be beyond argument.
    success: MATCH. Your copy is the drive the yard handed over, byte for byte, and the original is back in the bag.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*acquire\\b" }
        # The copy, not the original: this is Case 1's lesson, and the playthrough keeps it.
        - { kind: commandRun, pattern: "^\\s*hashsum\\b(?=.*--verify)(?!.*/dev/evidence/)" }

  - id: find-the-deleted
    description: List the deleted files on your copy, and pin the missing invoices' records to the board.
    why: A file's record keeps its name and its times after the file is deleted. That is a better witness than anybody's memory of Saturday.
    success: The invoices' records are on the board. Deleted, all three, within five seconds of each other.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*lsfs\\b" }
        - { kind: pinned, evidence: "disk:qf-lt-07:mft/*Invoices*inv-04*" }

  - id: recover-and-carve
    description: Recover the invoices that can be recovered. Carve what is left of the one that can't, and pin the carved part.
    why: Deleted is not the same as gone, and gone is not always all gone. Which one each invoice is decides what the report can say about it.
    success: Two invoices back whole, and the start of the third carved out of unallocated space. A header, the first runs, and no end.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*recover\\b" }
        - { kind: commandRun, pattern: "^\\s*carve\\b" }
        - { kind: pinned, evidence: "disk:qf-lt-07:carve/*QF-INV-0410*" }

  - id: find-the-remote-logon
    description: Find the sign-in to this laptop that was open while the invoices were deleted, and pin it.
    why: An account name says whose sign-in was used. How it signed in, and from where, says who could have been at the keys.
    success: A remote sign-in, logon type 10, from 10.60.0.21. Somebody used this account from another machine.
    check: { kind: pinned, evidence: "log:security/where eventId=4624 and LogonType=10" }

  - id: order-the-evening
    description: Put Saturday evening in order on the timeline, with every time in the same zone.
    why: The logs, the owner's email and the door log keep three different clocks. Until every time is in one zone, you can't say what came first.
    success: One evening, one zone. The bookkeeper signs out at 17:31, and the remote sign-in comes more than two hours later.
    check: { kind: commandRun, pattern: "^\\s*timeline\\b(?=.*--(around|from)\\b)" }

  - id: find-where-it-went
    description: Find where the price lists went after they left the laptop, and pin the record that shows it.
    why: The customer has a price list. Finding the way out is what turns that into something the yard can fix.
    success: An upload from the yard office laptop to 203.0.113.80, a minute after the zip was made. You found it in the logs, and you left the address alone.
    check: { kind: pinned, evidence: "log:firewall/where dst=203.0.113.80" }

  # The harmless noise (11 §Bonus): the nightly backup at 19:45, which moves 48 MB off the laptop
  # three minutes after the deletions. Pinning its process start is the moment a player sees what
  # it is: a scheduled job by SYSTEM, the same one every night.
  - id: backup-is-routine
    name: Not Every Shadow
    description: Look into the large transfer off the laptop at 19:45, and pin what it turned out to be.
    why: The worst moment for something ordinary to happen is right after something that isn't. Checking it is how you keep it out of the report.
    success: The nightly backup, started by the system at the same time every night, to the yard's own server. Noticed, checked, and left out of the story.
    optional: true
    check: { kind: pinned, evidence: "log:sysmon-lite/where eventId=1 and Image=*yard-backup*" }

  # 11 §Secret, "Two clocks": the door log's 18:31 converted to 17:31 UTC before it is used, and the
  # bookkeeper's own sign-out found at that minute. Converting it yourself or giving the tool the
  # offset both count; comparing the raw 18:31 with the log does not.
  - id: two-clocks
    name: Two Clocks
    description: Convert the door log's time to UTC, and find the sign-out it matches.
    why: A time written by a person is a time on somebody's clock. Converting it before you use it is the difference between a finding and a mix-up.
    success: Two clocks, one minute. The door log's 18:31 is 17:31 UTC, the same minute the bookkeeper's own session ended.
    hidden: true
    check:
      kind: all
      of:
        - kind: commandRun
          pattern: "^\\s*(logq|timeline)\\b.*(2026-04-11T17:[23]\\d|2026-04-11T18:[23]\\d(:\\d\\d)?\\+01:00)"
        - { kind: pinned, evidence: "log:security/where eventId=4634 and LogonType=2" }

hints:
  copy-and-verify:
    - The same first step as last week. Before you ask the drive anything, make a copy of it and show the copy is the drive that was handed over.
    - Imaging makes the copy and prints its hashes. The handover form carries the hash taken at the yard. One option compares the two.
    - "Run `acquire /dev/evidence/qf-lt-07 --out images/qf-lt-07.img`, then `hashsum --verify <the SHA-256 from handover.txt> images/qf-lt-07.img`."
  find-the-deleted:
    - The owner says the invoices folder went empty. Ask your copy what was in that folder, including what isn't there any more.
    - Deleting a file leaves its record behind, marked deleted. One option lists only those records, across the whole drive.
    - "Run `lsfs images/qf-lt-07.img -r -d`, then `inode images/qf-lt-07.img <record>` on an invoice and `pin` it."
  recover-and-carve:
    - Try to get each invoice back. One of them will not come back whole, and the tool will tell you why.
    - A deleted file comes back only while nothing has written over it. When something has, a carver can still find what is left by its first bytes, in the space no file owns.
    - "Run `recover images/qf-lt-07.img <record> --out export/<name>.pdf` for each, then `carve images/qf-lt-07.img`, read the partial one with `strings`, and `pin` it."
  find-the-remote-logon:
    - The invoices went at a known minute. Somebody was signed in to this laptop then. Find out which account, and how it signed in.
    - Every sign-in is a 4624 record in the security log, and its LogonType says how. 2 is at the keyboard, 3 is a shared folder, 10 is a remote desktop.
    - "Run `logq --id 4624 --count-by LogonType`, then `logq --id 4624 --where LogonType=10`, and `pin` it."
  order-the-evening:
    - Line up everything that happened that evening in one list. Then line up the owner's time and the door log's time against it.
    - A timeline merges every source into one list, in UTC unless you ask for local time. The owner and the door log both used British Summer Time, an hour ahead.
    - "Run `timeline --around <the ref of the remote sign-in>`, or `timeline --from 2026-04-11T17:00Z --to 2026-04-11T20:00Z`."
  find-where-it-went:
    - The price lists reached a customer. Something carried them out of the yard, and the yard's firewall writes down everything it lets out.
    - The firewall log has one line per connection it allowed. Counting them by where they went makes the unusual one stand out.
    - "Run `logq --source firewall --count-by dst`, then `logq --source firewall --where dst=<the address that stands out>`, and `pin` it."
  backup-is-routine:
    - Something big left the laptop at 19:45, minutes after the deletions. Before it goes in the report, find out what it was.
    - A process start record says which program ran, who started it and with what command line. Check whether the same thing happened on other nights too.
    - "Run `logq --source sysmon-lite --id 1 | grep yard-backup`, compare the nights, and `pin` one."

report:
  questions:
    - id: which-account
      ask: Which account signed in to the bookkeeper's laptop while the invoices were deleted?
      type: account
      answer: jory
      acceptedEvidence:
        - "log:security/where eventId=4624 and LogonType=10"
      explain: >-
        The account is the bookkeeper's, and that is all an account name can tell you: which
        sign-in was used. It says nothing about whose hands were on the keyboard. The next two
        questions are where that gets answered.

    - id: which-machine
      ask: Which machine did that sign-in come from? Write its name the way the sign-in record gives it.
      type: host
      answer: qf-lt-03
      acceptedEvidence:
        - "log:security/where eventId=4624 and LogonType=10"
      explain: >-
        The record names the workstation and its address, 10.60.0.21, and both are the yard office
        laptop: the one that was left signed in over the weekend, examined last week. The
        bookkeeper's laptop was signed in to from across the office, not from its own keyboard.

    - id: logon-type
      ask: How did that sign-in happen?
      type: choice
      answer: "Logon type 10: remote desktop, from another machine"
      choices:
        - "Logon type 2: at the laptop's own keyboard"
        - "Logon type 10: remote desktop, from another machine"
        - "Logon type 5: a service the laptop runs by itself"
      acceptedEvidence:
        - "log:security/where eventId=4624 and LogonType=10"
      explain: >-
        Type 10 is a remote desktop sign-in: someone at another computer, seeing this one's screen.
        Every sign-in the bookkeeper made at this laptop is a type 2. A type 3 follows a minute
        later from the same address, which is a shared folder being opened: the way the zip left.

    - id: when-deleted
      ask: When were the invoices deleted? Give the time in UTC.
      type: timestamp
      answer: "2026-04-11T19:42:03Z"
      toleranceSeconds: 60
      answerFrom: invoices-deleted
      acceptedEvidence:
        - "disk:qf-lt-07:mft/*Invoices*inv-04*"
        - "log:sysmon-lite/where eventId=23 and TargetFilename=*inv-04*"
      explain: >-
        The records' changed times and the monitor's deletion lines agree, within five seconds of
        each other. The owner's email said "around 20:40", and that was right too, on the clock she
        reads: British Summer Time, an hour ahead of UTC.

    - id: bookkeeper-present
      ask: Was the bookkeeper at the yard when the invoices were deleted?
      type: choice
      answer: "No. The door log's 18:31 is 17:31 UTC, the minute their own session ended, more than two hours before the deletions"
      choices:
        - "Yes. The door log has them leaving at 18:31, an hour after the laptop signed them out, so they stayed on"
        - "No. The door log's 18:31 is 17:31 UTC, the minute their own session ended, more than two hours before the deletions"
        - "Yes. Their account was signed in when the invoices were deleted"
      acceptedEvidence:
        - "log:security/where eventId=4634 and LogonType=2"
        - "log:security/where eventId=4624 and LogonType=10"
      feedback:
        - choice: "Yes. The door log has them leaving at 18:31, an hour after the laptop signed them out, so they stayed on"
          speaker: teammate-idris
          text: >-
            Those two are the same moment on two clocks. The door controller shows British Summer
            Time, and the security log is in UTC, an hour behind. Put 18:31 into UTC before you put
            it next to the log, and see where it lands.
        - choice: "Yes. Their account was signed in when the invoices were deleted"
          speaker: mentor-noor
          text: >-
            Their account was, and that is a different claim. An account is a name and a password,
            and anyone holding both can use it. Look at how that sign-in happened, and where it
            came from, before you let it stand for a person.
      explain: >-
        The door log and the security log agree once they share a zone: the bookkeeper's session
        ended at 17:31 UTC and they left the building that minute. Nothing in the evidence puts
        them at a keyboard after that.

    - id: where-it-went
      ask: Where did the price lists go after they left the yard? Give the address.
      type: host
      answer: 203.0.113.80
      acceptedEvidence:
        - "log:firewall/where dst=203.0.113.80"
        - "log:dns/where answer=203.0.113.80"
      explain: >-
        The firewall let a small upload out from the office laptop a minute after the zip reached
        it, to an address the yard had never talked to before. That is as far as the evidence goes,
        and as far as the report goes: nobody connects to that address, or asks it anything.

    - id: two-fixes
      ask: Which two changes would have closed the doors used that evening?
      type: choice
      answer: "Keep passwords out of shared folders, and lock screens that are left unattended"
      choices:
        - "Keep passwords out of shared folders, and lock screens that are left unattended"
        - "Take the bookkeeper's account away, and check their bag at the gate"
        - "Find out who is behind 203.0.113.80, and ask for the files back"
      acceptedEvidence:
        - "log:security/where eventId=4624 and LogonType=10"
      feedback:
        - choice: "Take the bookkeeper's account away, and check their bag at the gate"
          speaker: teammate-theo
          text: >-
            That fixes a person, and the person is not what broke. Anyone who found that password
            in that folder, at that unlocked laptop, could have done the same. Look at what let the
            sign-in happen, and fix that.
        - choice: "Find out who is behind 203.0.113.80, and ask for the files back"
          speaker: mentor-noor
          text: >-
            We never connect to an attacker's address, not to look and not to ask. It can warn
            them, it can break the law, and it can hit someone who had nothing to do with it. That
            address goes in the report, and anything beyond that is for the police.
      explain: >-
        The evening needed two open doors: a password written in a folder anyone could read, and an
        office laptop left signed in with nobody at it. Close either one and the sign-in never
        happens. Separate accounts for each person, and a firewall that only lets out what the yard
        expects, would each have made it harder again.

    # The choice beat (11 §Choice beat). The owner's message asks for a report that names the
    # bookkeeper; this is where the player answers her.
    - id: owner-request
      ask: The owner's message asks your report to confirm it was the bookkeeper. What does your report say?
      type: choice
      answer: "What the evidence shows, whoever it points at"
      choices:
        - "That it was the bookkeeper, as the owner asked"
        - "What the evidence shows, whoever it points at"
        - "Nothing about who, so that nobody is upset"
      acceptedEvidence:
        - "log:security/where eventId=4624 and LogonType=10"
        - "log:security/where eventId=4634 and LogonType=2"
      feedback:
        - choice: "That it was the bookkeeper, as the owner asked"
          speaker: mentor-noor
          text: >-
            A report that says what the client wants is worth nothing the moment anyone checks it,
            and in court someone will. It is also unfair to a person who went home at 17:31. The
            owner is paying for what happened, not for agreement. Pick again.
        - choice: "Nothing about who, so that nobody is upset"
          speaker: mentor-noor
          text: >-
            Leaving it out still leaves the bookkeeper under suspicion, and the evidence you found
            is what lifts it. Say what the records show, plainly, and let them do the work. Pick
            again.
      explain: >-
        The evidence decides, and here it clears the person everyone suspected. Your report says
        whose account was used, from which machine, and when the bookkeeper left, and it says that
        whoever reads it.

debrief:
  summary: >-
    You copied the bookkeeper's laptop without changing it, brought back two invoices and the start
    of a third, and found the sign-in that deleted them: a remote one, from the yard office laptop,
    more than two hours after the bookkeeper went home. You put the owner's time and the door log
    in the same zone as the logs, followed the price lists out through the firewall, and wrote a
    report that says what the evidence shows.
  whatYouLearned:
    - A deleted file can come back until something writes over it. After that, a carver can find only what is left, with no name and no times.
    - A sign-in record gives the account, the machine it came from and how it signed in, and the account on its own is not a person.
    - A time means nothing until you know its zone. You put the owner's time and the door log's into UTC before comparing them with the logs.
    - A report says what the evidence shows, whoever that points at, even when the client asked for something else.
  ethicsNote: >-
    The owner suspected the bookkeeper, and a report written to agree with her would have cost a
    person their job for something they did not do. The investigation was of the company's laptop
    and logs, which the company asked for in writing, and it went where the evidence went. It also
    stopped where the letter did: the office laptop, anybody's own phone, and Brackensett Joinery's
    computers were left alone, and nobody connected to 203.0.113.80. The bookkeeper is owed an
    apology, and the report should say so.
  defensiveTakeaway: >-
    Four changes the yard can make this week. Take the passwords out of the shared folder and
    change every one that was in it. Set every laptop to lock its screen after a few idle minutes.
    Give each person an account of their own, so a sign-in points at one person's password and no
    one else's. And have the firewall allow out only what the yard uses, so an upload to an address
    it has never seen stands out, or never leaves.
  nextTease: The dispatch server has been running all weekend too, and something on it is still running.
  furtherReading:
    - foundations-chain-of-custody
