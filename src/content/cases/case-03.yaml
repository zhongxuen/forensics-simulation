# case-03, "Something is still running" (docs/plan/12-case-3-something-is-still-running.md).
#
# The chapter's last case, and its first live machine. Quillfen's dispatch server has been talking
# to an address outside the yard once a minute since Sunday night, and Idris captured its memory
# before anybody touched the power. The case teaches the order of volatility, process trees and
# hidden processes, network connections, injected code, and lining memory up with the sign-in
# records: the memory examiner's workflow. It ends the chapter.
#
# Five places this file leaves the plan, each because of what the engine allows:
#
# - 12 §Choice beats puts "pull the plug or capture memory first?" before anything, as a choice the
#   player makes. The runner has no in-workspace choice yet, and the capture is a story action, so
#   here Idris captures memory on arrival (the team's standing order) and Kit, who wanted the plug
#   out, asks whether that was right. The choice is the report question `pull-the-plug`, with
#   Noor's explanation on the debrief for the other choice and Change your report offering it again,
#   the way Case 2's choice beat works. The first objective is to open the capture before anything
#   else, which is the same lesson from the other side.
# - The second choice beat, Kit wanting to connect to 203.0.113.47, is the report question
#   `hack-back`, with a beat on `find-the-beacon` where Kit says it out loud.
# - 12 §Report's two choice lists ("why", "containment and fixes") are single choices, one of which
#   holds every right reason. The report has no multi-pick answer yet.
# - The harmless runtime-compiler region in the dispatch app is written with `inject` by `system`:
#   the action is what leaves a writable, runnable region with no file behind it, whoever made it.
# - The beacon ran from Sunday night to Tuesday morning, once a minute. The yard's firewall only
#   keeps a day of detail, so the letter says Gus exported two windows: Sunday night, when it began,
#   and Tuesday morning, up to the capture. The story writes those two, and memory holds the last
#   forty check-ins, which is what a capture would still find.
#
# No drive is handed over. The letter says why: the server runs the yard's dispatch, it stays up
# until it is rebuilt, and the rebuild is one of the report's fixes.
id: case-03
version: 1
title: Something is still running
client:
  org: Quillfen Freight
  signedBy: Delia Quillfen, owner, Quillfen Freight, and Theo Ashgrove, team lead, Candlewright Security
  letter: |
    This morning Gus Thimblegate noticed our firewall showing the dispatch server, qf-srv-01,
    talking to an address none of us recognise, once a minute, every minute. The dispatch
    program still works, and the lorries still go out.

    Please examine the dispatch server's memory and the yard's logs, and tell us what is running
    on it, how it got there, and what we should do. Your colleague Idris is on site with Gus. The
    server runs the whole yard, so it stays switched on until you tell us how to rebuild it.

    Gus has exported the firewall's log for Sunday night, when the connections began, and for
    this morning. The firewall only keeps a day of detail, so there is nothing for Monday.

    Only the dispatch server and the yard's logs are part of this. Please do not contact the
    address it is talking to, or anyone behind it.
estimatedMinutes: 30
seed: 20260415
hook: A server is talking to a stranger once a minute. Find out what is running, before anybody pulls the plug.
learningGoals:
  - Why memory is captured before a machine is switched off, and what would be lost if it weren't
  - How a process's folder, its parent and the active list show a program that doesn't belong
  - How to tell injected code from a harmless runtime compiler in the same kind of memory
  - How the sign-in records say how someone got in, and a timeline puts memory and logs in one order
concepts:
  - foundations-order-of-volatility
  - memory-why-ram-matters
  - memory-processes-and-parents
  - memory-network-artefacts
  - memory-code-injection
  - logs-windows-logon-events
  - logs-super-timelines
briefing:
  scenario: >-
    Quillfen's dispatch server has been talking to an address outside the yard once a minute since
    Sunday night. It runs the whole yard, so it is still switched on. Idris is on site, and captured
    the server's memory the moment he arrived. The capture and the yard's logs are on your
    workstation, with the letter.
  role: >-
    You are on Candlewright Security's blue team, at the examining workstation ir-ws-01, signed in
    as examiner. The case folder is open in the terminal, and the memory capture is waiting.
  authorization: >-
    Delia Quillfen, who owns Quillfen Freight, and Theo Ashgrove, Candlewright's team lead, both
    signed on 14 April 2026. The letter covers the dispatch server qf-srv-01, its memory and the
    yard's security, process and firewall logs. It does not cover the address the server is
    talking to, or anyone behind it.

machines:
  - id: qf-srv-01
    kind: windows-server
    baseline: office-server-v1
    zone: Europe/London
    ip: 10.60.1.10
    accounts: [dispatch-admin]
  - id: ir-ws-01
    kind: linux-workstation
    baseline: analyst-workstation-v1
    zone: Europe/London

# The ground truth, in UTC. The yard's clocks show British Summer Time, an hour ahead.
story:
  # --- Before the weekend: the way the server is normally looked after. ---

  # Gus signs in over remote desktop from the office on Friday afternoons to install updates. The
  # same account, the same kind of sign-in, from inside the yard.
  - at: "2026-04-10T15:10:00Z"
    actor: user:dispatch-admin
    on: qf-srv-01
    do: logon
    with: { account: dispatch-admin, type: remote, from: 10.60.0.21, workstation: QF-LT-03 }

  - at: "2026-04-10T15:10:08Z"
    actor: user:dispatch-admin
    on: qf-srv-01
    do: run-process
    with:
      name: explorer.exe
      path: 'C:\Windows\explorer.exe'
      parent: userinit.exe
      cmdline: 'C:\Windows\explorer.exe'
      user: dispatch-admin

  - at: "2026-04-10T15:36:40Z"
    actor: user:dispatch-admin
    on: qf-srv-01
    do: logoff
    with: { account: dispatch-admin }

  # The dispatch program is a .NET application. Its runtime compiles code while it runs, and that
  # leaves memory that is writable, runnable and backed by no file: the harmless region the case
  # asks a player to tell apart from the other one.
  - at: "2026-04-10T15:30:00Z"
    actor: system
    on: qf-srv-01
    do: inject
    note: Not an attack. The dispatch program's runtime compiling its own code leaves memory of the same kind.
    with:
      into: dispatch-svc.exe
      preview: "\x55\x48\x08\x53\x56\x57\x41\x54\x41\x55\x48\x03\x65\x10\x48\x0b\x71\x48\x0b\x5a"
      size: 65536

