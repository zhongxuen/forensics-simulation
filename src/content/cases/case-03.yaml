evidence:
  disks: []
  logs: [security, sysmon-lite, firewall]
  memory: [qf-srv-01]
  # The server showed British Summer Time. `--zone local` shows the security log the way it did.
  zones: { security: Europe/London }

# The cold open: two lines, then the first objective (docs/plan/99-reference.md, "Cold opens").
beats:
  - on: start
    speaker: teammate-kit
    text: >-
      Kit Nakashima-Reyes here, and I said it on the phone: pull the power cord. It has been talking
      to a stranger since Sunday. Every minute we wait is another minute of that.
  - on: start
    speaker: teammate-idris
    text: >-
      Idris Fenwick, on site at the yard. I captured the memory before anybody touched the cord, and
      you are about to see why. Open the capture first, then tell me whether Kit was right.
  - on: { objective: capture-first }
    speaker: mentor-noor
    text: >-
      Noor Halvorsen, your mentor. Everything in that file was only ever in the server's memory: the
      programs running, the connections open, the code sitting in them. Switch the power off and all
      of it is gone. The drive would still be there, and it would tell you almost none of this.
  - on: { objective: find-the-beacon }
    speaker: teammate-kit
    text: >-
      There it is, 203.0.113.47. I could open a connection to it right now and see who answers. Five
      minutes, tops. Should I?
  - on: { objective: why-it-stands-out }
    speaker: teammate-idris
    text: >-
      A real svchost.exe lives in System32 and is started by services.exe. This one lives in
      ProgramData, was started by a desktop, and has taken itself off the list. Three things wrong,
      and any one of them would have been worth a look.
  - on: { objective: how-they-got-in }
    speaker: teammate-theo
    text: >-
      Theo Ashgrove, team lead. Three hundred and twelve guesses and one right one. Nobody broke
      anything. They tried the door until a password from somewhere else opened it.
  - on: complete
    speaker: teammate-idris
    text: >-
      One laptop left unlocked, one password on a note in a shared folder, and one door left open to
      the internet, with the same two letters left behind. Nobody broke in at Quillfen. They walked
      through doors, and your three reports say which ones. Write this one up.

objectives:
  - id: capture-first
    description: Before anything else, open the memory capture and see what it holds.
    why: Memory is the evidence that vanishes first. Everything this case needs is in the capture, and would have gone with the power.
    success: One server, captured at 09:31 UTC with its programs still running and its connections still open. That is what the power cord would have taken.
    check: { kind: commandRun, pattern: "^\\s*mem\\s+info\\b" }

  - id: find-the-beacon
    description: Find the program that talks to 203.0.113.47, and pin its connection or the program itself.
    why: The firewall says something is calling out. Memory says which program is doing it, and that is where the rest of the case starts.
    success: Found it. A program calling itself svchost.exe, process 4376, opening a connection to 203.0.113.47 once a minute.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*mem\\s+netscan\\b" }
        - kind: any
          of:
            - { kind: pinned, evidence: "mem:qf-srv-01-mem:conn/*203.0.113.47*" }
            - { kind: pinned, evidence: "mem:qf-srv-01-mem:pid/4376" }

  - id: why-it-stands-out
    description: Show why that program doesn't belong. Compare the active process list with a full scan, check its parent and its folder, and pin the process.
    why: A name is the easiest thing to fake. Where a program lives, what started it and whether it hides are much harder to fake.
    success: Wrong folder, wrong parent, and missing from the active list. A real svchost.exe has none of those three.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*mem\\s+psscan\\b" }
        - { kind: commandRun, pattern: "^\\s*mem\\s+(ps|pstree)\\b" }
        - { kind: pinned, evidence: "mem:qf-srv-01-mem:pid/4376" }

  - id: find-the-injection
    description: Find the stretch of memory that holds code with no file behind it, and pin the one that is the problem.
    why: Code that was never loaded from a file is how a program hides what it really runs. There are two regions like that here, and only one is trouble.
    success: A whole program sitting in process 4376's memory, starting MZ, writable and runnable, with no file behind it.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*mem\\s+malfind\\b" }
        - { kind: pinned, evidence: "mem:qf-srv-01-mem:vad/0x2010000" }

  - id: how-they-got-in
    description: Find how they got in. Count the refused sign-ins, then pin the sign-in that worked and the account they made.
    why: Knowing what runs tells the yard what to remove. Knowing how it got there tells them what to close.
    success: 312 refused guesses from 198.51.100.23, one remote sign-in as dispatch-admin that worked, and a new administrator account four minutes later.
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*logq\\b.*--count-by\\b" }
        - { kind: pinned, evidence: "log:security/where eventId=4624 and IpAddress=198.51.100.23" }
        - { kind: pinned, evidence: "log:security/where eventId=4720" }

  - id: line-it-up
    description: Put Sunday night in order on the timeline, from the first guess to the first check-in.
    why: Memory and logs keep different kinds of record. One list, in one zone, is how you see that they tell a single story.
    success: One night in order. The guessing, the sign-in, the account, the program, and its first call out, all inside twenty minutes.
    check: { kind: commandRun, pattern: "^\\s*timeline\\b(?=.*--(around|from)\\b)" }

  # 12 §Bonus: the dispatch program's runtime compiler, which malfind shows too. Pinning it is the
  # moment a player checks which process a region is in and what its first bytes are.
  - id: jit-is-routine
    name: Honest Compiler
    description: Find the other region malfind shows, and pin it once you know why it is harmless.
    why: A report that calls the yard's own dispatch program an attack would send them to rebuild the wrong thing.
    success: The dispatch program's runtime compiler, making code while it runs. No MZ, no hiding, in a process that has every reason to do it. Checked, and left out.
    optional: true
    check: { kind: pinned, evidence: "mem:qf-srv-01-mem:vad/0x2000000" }

  # 12 §Secret, "Every minute on the minute": the gap between check-ins measured from their times.
  - id: on-the-minute
    name: On The Minute
    description: Measure how often the program calls out, from the times of its connections.
    why: A person clicks at odd moments. A program waits for its timer. The gap between calls is how you tell which one you are looking at.
    success: Sixty seconds, every time, to the second. That is a timer, not a person, and the word for it is a beacon.
    hidden: true
    check:
      kind: all
      of:
        - { kind: commandRun, pattern: "^\\s*logq\\b.*203\\.0\\.113\\.47" }
        - {
            kind: pinned,
            evidence: "log:sysmon-lite/where eventId=3 and DestinationIp=203.0.113.47",
          }

hints:
  capture-first:
    - Idris made a file of everything the server was holding in its memory. Start by asking that file what it is.
    - A memory capture says which machine it came from, when it was taken and what it holds. One subcommand of the memory tool prints exactly that.
    - "Run `mem`, then `mem info qf-srv-01-mem`."
  find-the-beacon:
    - The firewall says the server is calling an address outside the yard. Memory knows which program has that connection open.
    - The memory tool can list every network connection in the capture, with the process that owns each one.
    - "Run `mem netscan qf-srv-01-mem`, find the lines to 203.0.113.47, and `pin` one of them."
  why-it-stands-out:
    - The name looks ordinary. Look at where the program lives, what started it, and whether it shows up where running programs normally do.
    - The active process list is what most tools ask for first, and a program can take itself off it. A full scan finds every process record, listed or not.
    - "Run `mem ps qf-srv-01-mem`, then `mem psscan qf-srv-01-mem` and look for the one marked unlinked, check its parent with `mem cmdline qf-srv-01-mem --pid 4376`, and `pin` its psscan line."
  find-the-injection:
    - Ordinary code is loaded from a file and can't be changed while it runs. Look for memory that is both, and not from any file.
    - One subcommand lists regions that are writable and runnable with no file behind them, and prints their first bytes. There will be two. Check which process each is in.
    - "Run `mem malfind qf-srv-01-mem`, find the region in process 4376 that starts with MZ, and `pin` one of its lines."
  how-they-got-in:
    - Somebody signed in to this server on Sunday night. Before that, somebody tried many times and was refused.
    - A refused sign-in is a 4625 record, a sign-in that worked is a 4624, and a new account is a 4720. Counting the refusals by where they came from makes the pattern plain.
    - "Run `logq --id 4625 --count-by IpAddress`, then `logq --id 4624 --where IpAddress=<the address that stands out>` and `pin` it, then `logq --id 4720` and `pin` that."
  line-it-up:
    - Put everything from Sunday night in one list, in time order, and read it from the first guess onwards.
    - A timeline merges the logs and the memory capture into one list, in UTC. Ask it for a window, or for the moments around one piece of evidence.
    - "Run `timeline --from 2026-04-12T22:45Z --to 2026-04-12T23:15Z`, or `timeline --around <the ref of the remote sign-in>`."
  jit-is-routine:
    - Two regions look alike. One is in a program the yard runs every day.
    - A runtime compiler, the part of .NET that turns code into machine instructions while a program runs, makes regions like this on purpose. Its bytes start mid-instruction, with no file header.
    - "Run `mem malfind qf-srv-01-mem`, look at the region in the yard's dispatch program, check `mem cmdline qf-srv-01-mem --pid 1016` for what it is, and `pin` it."

report:
  questions:
    - id: how-they-got-in
      ask: How did they get in?
      type: choice
      answer: "Hundreds of guessed passwords over remote desktop, then one that worked"
      choices:
        - "Hundreds of guessed passwords over remote desktop, then one that worked"
        - "A memory stick plugged into the server"
        - "A weakness in the dispatch program's web page"
      acceptedEvidence:
        - "log:security/where eventId=4625 and IpAddress=198.51.100.23"
        - "log:security/where eventId=4624 and IpAddress=198.51.100.23"
      explain: >-
        312 refused sign-ins in ten minutes from one address outside the yard, then a remote sign-in
        from the same address that worked. Remote desktop on this server answered anyone on the
        internet, and that was the door.

    - id: which-account
      ask: Which account did they sign in with?
      type: account
      answer: dispatch-admin
      acceptedEvidence:
        - "log:security/where eventId=4624 and IpAddress=198.51.100.23"
      explain: >-
        A real account, with a password that had been used somewhere else. It was refused
        twenty-four times in the burst and accepted four minutes later, which is what a list of
        leaked passwords looks like when one of them fits.

    - id: what-they-added
      ask: Which account did they add, to get back in later?
      type: account
      answer: svc-update
      acceptedEvidence:
        - "log:security/where eventId=4720"
        - "log:security/where eventId=4732"
      explain: >-
        Made two minutes after the sign-in and put in Administrators twelve seconds later. A name
        chosen to look like something the server needs, and a door that stays open when the
        password is changed.

    - id: which-process
      ask: Which process is the problem? Pick it from your board.
      type: evidence-pick
      answer: "mem:qf-srv-01-mem:pid/4376"
      acceptedEvidence:
        - "mem:qf-srv-01-mem:pid/4376"
      explain: >-
        Process 4376. Its name borrows a real Windows program's, and that is the only ordinary thing
        about it.

    - id: why-malicious
      ask: What gives it away?
      type: choice
      answer: "Its folder, its parent, its hiding from the active list, and the program in its memory with no file behind it"
      choices:
        - "Its name: every svchost.exe is suspicious"
        - "Its folder, its parent, its hiding from the active list, and the program in its memory with no file behind it"
        - "It uses more memory than anything else on the server"
      acceptedEvidence:
        - "mem:qf-srv-01-mem:pid/4376"
        - "mem:qf-srv-01-mem:vad/0x2010000"
      explain: >-
        A real svchost.exe runs from System32 and is started by services.exe, and the server has one
        of those too. This one runs from ProgramData, was started by explorer.exe, is missing from
        the active list, and carries a whole program in memory that was never loaded from a file.

    - id: where-it-talks
      ask: Which address does it talk to?
      type: host
      answer: 203.0.113.47
      acceptedEvidence:
        - "mem:qf-srv-01-mem:conn/*203.0.113.47*"
        - "log:firewall/where dst=203.0.113.47"
        - "log:sysmon-lite/where eventId=3 and DestinationIp=203.0.113.47"
      explain: >-
        Once a minute since Sunday night, on port 443 so it looks like ordinary web traffic. The
        address goes in the report, and it goes on the firewall's block list, and that is all
        anybody here does with it.

    - id: fixes
      ask: What should the yard do now?
      type: choice
      answer: "Close remote desktop to the internet, reset passwords and turn on a second sign-in step, remove svc-update, block the address and rebuild the server from a known-good image"
      choices:
        - "Delete C:\\ProgramData\\svchost.exe and carry on"
        - "Close remote desktop to the internet, reset passwords and turn on a second sign-in step, remove svc-update, block the address and rebuild the server from a known-good image"
        - "Change the dispatch-admin password, and leave the rest as it is"
      acceptedEvidence:
        - "log:security/where eventId=4624 and IpAddress=198.51.100.23"
        - "log:security/where eventId=4720"
      explain: >-
        Deleting one file leaves the door, the account and whatever else they did while they were
        in. Close the door, change what they could have learned, remove what they added, stop the
        calls, and rebuild, because a server someone else ran as administrator can't be trusted again.

    # Choice beat 1 (12 §Choice beats): the order of volatility.
    - id: pull-the-plug
      ask: Kit wanted the power cord pulled the moment the calls were spotted. Idris captured memory first. Which was the right call?
      type: choice
      answer: "Capture memory first, then contain it"
      choices:
        - "Pull the plug at once, to stop it"
        - "Capture memory first, then contain it"
      acceptedEvidence:
        - "mem:qf-srv-01-mem:pid/4376"
        - "mem:qf-srv-01-mem:vad/0x2010000"
      feedback:
        - choice: "Pull the plug at once, to stop it"
          speaker: mentor-noor
          text: >-
            Pull the plug and the running programs, the open connections and the code sitting in
            memory are gone for good. The hidden process you pinned was never on the drive. The
            order of volatility says take what disappears first, first. Pick again.
      explain: >-
        Memory goes first, so it is taken first (RFC 3227, the order of volatility). Ten minutes of
        capture kept a hidden process, its connection and its injected code, and the address was
        blocked straight after.

    # Choice beat 2 (12 §Choice beats): no hacking back.
    - id: hack-back
      ask: Kit wants to connect to 203.0.113.47 to see who's there. What goes in your report?
      type: choice
      answer: "Block the address at the firewall and write it in the report"
      choices:
        - "Connect to it, to see who answers"
        - "Scan it, to find out what it runs"
        - "Block the address at the firewall and write it in the report"
      acceptedEvidence:
        - "log:firewall/where dst=203.0.113.47"
      feedback:
        - choice: "Connect to it, to see who answers"
          speaker: mentor-noor
          text: >-
            Connecting tells whoever is there that they have been found, and they may clean up or
            hit back. The address may be somebody else's machine that was broken into as well. And
            without their permission it is a crime, whoever is behind it. Pick again.
        - choice: "Scan it, to find out what it runs"
          speaker: teammate-theo
          text: >-
            A scan is still us touching a machine nobody gave us permission to touch. Our letter
            covers the yard's server and the yard's logs, and it stops there. Block it, record it,
            and anything beyond that is for the police. Pick again.
      explain: >-
        The address is evidence, not a target. The firewall now refuses it, the report names it,
        and if the yard wants more done, the police are the ones who do it.

debrief:
  summary: >-
    You opened a memory capture taken before anyone touched the power, found the program calling
    out once a minute, and showed why it didn't belong: the wrong folder, the wrong parent, hidden
    from the active list, and carrying a program in memory with no file behind it. You told it apart
    from the dispatch program's own compiler, traced the way in to 312 guessed passwords and one
    that worked, and put Sunday night in one order. The address went in the report and on the block
    list, and nowhere else.
  whatYouLearned:
    - Memory is captured before a machine is switched off, because running programs, connections and code in memory vanish with the power.
    - A program's folder, its parent and whether it hides from the active list say more about it than its name does.
    - Writable, runnable memory with no file behind it can be an attack or a runtime compiler. The process it is in and its first bytes tell you which.
    - Sign-in records show how someone got in, and a timeline puts memory and logs in one order.
  ethicsNote: >-
    Kit wanted to pull the plug, and then to connect to the address. Both come from wanting it to
    stop, and both would have made things worse: the first by destroying the evidence, the second by
    tipping off whoever is there, possibly hitting someone else's broken-into machine, and breaking
    the law. The investigation stayed inside the letter: the yard's server, its memory and its logs.
    The address is in the report and on the block list, and anything more is for the police.
  defensiveTakeaway: >-
    Close remote desktop to the internet, or put it behind the yard's VPN. Reset every password on
    the server and use a different one for each account, with a second sign-in step. Remove
    svc-update and check the Administrators group. Keep the block on 203.0.113.47. Then rebuild the
    server from a known-good image, because a machine someone else ran as administrator can't be
    trusted again, and turn on alerts for a burst of refused sign-ins.
  nextTease: The Hollow Latch have been busy two streets over, and Candlewright's red team has the other side of that story.
  furtherReading:
    - foundations-order-of-volatility
    - memory-code-injection
